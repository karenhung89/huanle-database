<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>欢乐伙伴 · 课文拼音搜索器 🌈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ===== 基础重置 ===== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;}
body{
  font-family:var(--hanzi-font, "ZCOOL KuaiLe","马善政毛笔楷书","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif);
  background:var(--bg);
  color:var(--text);
  padding-bottom:90px;
  line-height:1.7;
  transition:background .4s ease, color .3s ease;
}

/* ===== 主题变量 ===== */
/* 默认：糖果粉彩 */
body[data-theme="candy"]{
  --bg:linear-gradient(135deg,#fff6e5 0%,#ffe5ec 35%,#d9f2ff 70%,#e9ffef 100%);
  --primary:#ff7eb9;
  --primary-dark:#ff4f9b;
  --secondary:#7ec8ff;
  --accent:#ffd86b;
  --accent2:#a0e7a0;
  --card:#ffffff;
  --card2:#fffdf5;
  --card-border:rgba(255,126,185,.2);
  --text:#4a3b4d;
  --muted:#918195;
  --ruby-color:#ff7eb9;
  --tag1:#ff7eb9;--tag2:#7ec8ff;--tag3:#ffd86b;--tag4:#a0e7a0;--tag5:#c39bff;--tag6:#ffab7e;
  --search-bg:#ffffffcc;
  --tab-active:#ff7eb9;
  --btn-shadow:0 4px 0 #ff4f9b;
  --progress:#ffd86b;
  --hl:#fff59d;
}
/* 莫兰迪低饱和 */
body[data-theme="morandi"]{
  --bg:linear-gradient(135deg,#e8ddcf 0%,#d4c4b4 35%,#c3cbc7 70%,#d6cfc3 100%);
  --primary:#a39082;
  --primary-dark:#7d6d61;
  --secondary:#8aa0a0;
  --accent:#c6b289;
  --accent2:#97a894;
  --card:#f5efe6;
  --card2:#fbf7f0;
  --card-border:rgba(125,109,97,.2);
  --text:#4a443d;
  --muted:#8a7f73;
  --ruby-color:#8aa0a0;
  --tag1:#a39082;--tag2:#8aa0a0;--tag3:#c6b289;--tag4:#97a894;--tag5:#b5a3c5;--tag6:#c49a80;
  --search-bg:#f5efe6cc;
  --tab-active:#a39082;
  --btn-shadow:0 4px 0 #7d6d61;
  --progress:#c6b289;
  --hl:#e8dfc0;
}
/* 黑白护眼 */
body[data-theme="bw"]{
  --bg:#f4f1ec;
  --primary:#2d2d2d;
  --primary-dark:#000000;
  --secondary:#555555;
  --accent:#888888;
  --accent2:#bbbbbb;
  --card:#ffffff;
  --card2:#fafafa;
  --card-border:#cccccc;
  --text:#1a1a1a;
  --muted:#777777;
  --ruby-color:#333333;
  --tag1:#333;--tag2:#555;--tag3:#777;--tag4:#999;--tag5:#888;--tag6:#666;
  --search-bg:#fff;
  --tab-active:#222;
  --btn-shadow:0 4px 0 #000;
  --progress:#333;
  --hl:#fff59d;
}

/* ===== 卡通字体 vs 楷体 ===== */
body[data-font="kai"]{
  --hanzi-font:"KaiTi","STKaiti","AR PL UKai CN","DFKai-SB","楷体",serif;
}
body[data-font="cute"]{
  --hanzi-font:"ZCOOL KuaiLe","马善政毛笔楷书","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
}
.pinyin{font-family:"Baloo 2",system-ui,sans-serif;}

/* ===== 布局容器 ===== */
.container{max-width:960px;margin:0 auto;padding:14px 16px 20px;}

/* ===== 顶部 ===== */
.header{text-align:center;padding:10px 0 6px;position:relative;}
.mascot{font-size:36px;display:inline-block;animation:bounce 2s ease-in-out infinite;}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-8px) rotate(4deg);}}
.title{font-size:28px;font-weight:800;color:var(--primary);margin-top:2px;letter-spacing:1px;}
.subtitle{font-size:13px;color:var(--muted);margin-top:2px;}

/* ===== 顶部工具行（字体切换+主题切换） ===== */
.toolbar{
  display:flex;gap:8px;justify-content:center;
  margin:8px 0 12px;flex-wrap:wrap;
}
.tool-btn{
  border:none;background:var(--card);
  border:2px solid var(--card-border);
  color:var(--text);padding:8px 14px;border-radius:20px;
  font-family:inherit;font-size:14px;font-weight:700;
  cursor:pointer;box-shadow:var(--btn-shadow);
  transition:transform .1s, box-shadow .1s;
  display:inline-flex;align-items:center;gap:6px;
}
.tool-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--primary-dark);}
.theme-menu{
  position:relative;display:inline-block;
}
.theme-dropdown{
  display:none;position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:var(--card);border:2px solid var(--card-border);
  border-radius:16px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);
  z-index:50;min-width:160px;
}
.theme-menu.open .theme-dropdown{display:block;}
.theme-dropdown button{
  display:block;width:100%;text-align:left;border:none;
  background:transparent;padding:10px 12px;border-radius:12px;
  font-family:inherit;font-size:14px;font-weight:700;color:var(--text);
  cursor:pointer;
}
.theme-dropdown button:hover,.theme-dropdown button.active{background:var(--primary);color:#fff;}

/* ===== 搜索区 ===== */
.search-wrap{
  position:sticky;top:0;z-index:20;padding:8px 0;
  background:linear-gradient(180deg,var(--bg-top,rgba(255,246,229,.95)) 60%,transparent 100%);
}
body[data-theme="candy"]{--bg-top:rgba(255,246,229,.95);}
body[data-theme="morandi"]{--bg-top:rgba(232,221,207,.95);}
body[data-theme="bw"]{--bg-top:rgba(244,241,236,.95);}
.search-bar{
  display:flex;gap:8px;background:var(--search-bg);
  padding:8px 10px;border-radius:30px;
  border:3px solid var(--primary);
  box-shadow:0 6px 0 var(--primary-dark);
}
.search-bar input{
  flex:1;border:none;background:transparent;outline:none;
  font-family:inherit;font-size:18px;color:var(--text);padding:4px 8px;
}
.search-bar input::placeholder{color:var(--muted);}
.search-bar button{
  border:none;background:var(--primary);color:#fff;
  border-radius:20px;padding:6px 18px;font-family:inherit;font-size:15px;font-weight:700;
  cursor:pointer;box-shadow:0 3px 0 var(--primary-dark);
}
.search-bar button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--primary-dark);}
.hint-row{display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap;}
.chip{
  background:var(--card);border:2px solid var(--card-border);
  border-radius:16px;padding:4px 10px;font-size:12px;color:var(--muted);cursor:pointer;
}

/* ===== Tab 导航（桌面顶部 / 手机底部） ===== */
.tabs{
  display:flex;gap:6px;margin:12px 0;background:var(--card);
  padding:6px;border-radius:30px;border:2px solid var(--card-border);
}
.tab{
  flex:1;text-align:center;padding:10px 6px;border-radius:24px;
  cursor:pointer;font-weight:700;font-size:14px;color:var(--muted);
  transition:all .2s;
}
.tab.active{background:var(--tab-active);color:#fff;box-shadow:0 3px 0 var(--primary-dark);}
.tab .emo{font-size:18px;display:block;margin-bottom:2px;}
@media (max-width:640px){
  .tabs{
    position:fixed;left:10px;right:10px;bottom:10px;z-index:40;
    margin:0;background:var(--card);
    box-shadow:0 -4px 20px rgba(0,0,0,.12);
    padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));
  }
  .tab .emo{font-size:22px;}
  .tab .tlabel{font-size:12px;}
}
@media (min-width:641px){
  .tab .emo{display:block;}
  .tab .tlabel{display:inline;}
}

/* ===== 卡片通用 ===== */
.card{
  background:var(--card);border-radius:22px;padding:18px;
  border:2px solid var(--card-border);
  box-shadow:0 4px 0 rgba(0,0,0,.05);
  margin-bottom:14px;
}
.card h2{font-size:20px;color:var(--primary);margin-bottom:10px;}
.card h3{font-size:16px;color:var(--muted);margin:12px 0 6px;font-weight:700;}

/* ===== 搜索结果 ===== */
.result-head{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;
}
.bigchar{
  font-family:"Ma Shan Zheng",cursive;font-size:68px;line-height:1;
  background:linear-gradient(135deg,var(--tag1),var(--tag5));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.bigword{
  font-family:"Ma Shan Zheng",cursive;font-size:36px;
  color:var(--primary);font-weight:700;
}
.info-list{display:flex;flex-direction:column;gap:6px;font-size:15px;}
.info-list .pinyin{font-size:22px;color:var(--ruby-color);font-weight:700;}
.tag{
  display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700;
  color:#fff;margin:2px;
}
.tag.c1{background:var(--tag1);}.tag.c2{background:var(--tag2);}
.tag.c3{background:var(--tag3);color:#4a3b4d;}.tag.c4{background:var(--accent2);color:#2a4a2a;}
.tag.c5{background:var(--tag5);}.tag.c6{background:var(--tag6);}
.sentence-card{
  background:var(--card2);border-radius:16px;padding:12px 14px;margin-top:8px;
  border:2px dashed var(--card-border);
}
.sentence-head{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:6px;}
.stext{font-size:18px;line-height:1.9;}
.spiny{font-size:13px;color:var(--muted);margin-top:4px;font-family:"Baloo 2",sans-serif;}
mark.hl{background:var(--hl);border-radius:4px;padding:0 2px;font-weight:700;color:var(--text);}
.section-title{
  font-size:16px;font-weight:700;color:var(--primary);margin:14px 0 8px;
  display:flex;align-items:center;gap:8px;
}
.related-wrap{margin:8px 0;}
.related-wrap .tag{cursor:pointer;}
.occ-group{margin-top:10px;}
.occ-group-head{
  display:flex;align-items:center;gap:8px;
  padding:6px 10px;border-radius:14px 14px 0 0;
  background:var(--card2);border:2px solid var(--card-border);border-bottom:none;
  font-weight:700;font-size:14px;
}
.occ-count{background:var(--accent);color:#4a3b4d;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:700;}
.occ-body{border:2px solid var(--card-border);border-top:none;border-radius:0 0 14px 14px;padding:6px 10px;}

/* ===== 课文浏览 ===== */
.lesson-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:10px;
}
.lesson-mini{
  background:var(--card);border-radius:16px;padding:12px;border:2px solid var(--card-border);
  cursor:pointer;transition:transform .15s;text-align:center;
}
.lesson-mini:active{transform:scale(.96);}
.lesson-mini .lno{font-size:12px;color:var(--muted);}
.lesson-mini .ltitle{font-size:15px;color:var(--primary);font-weight:700;margin-top:4px;}
.book-title{
  font-size:22px;font-weight:800;color:var(--primary);
  margin:16px 0 8px;display:flex;align-items:center;gap:10px;
}
.back-btn{
  background:var(--secondary);color:#fff;border:none;padding:6px 14px;border-radius:14px;
  font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;
  box-shadow:0 3px 0 #4d96c4;
}
.back-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #4d96c4;}
.lesson-body{margin-top:10px;}
.reading-text{font-size:22px;line-height:2.6;text-align:center;margin:10px 0;}
.reading-text ruby{margin:0 2px;}
.reading-text ruby rt{
  font-size:13px;color:var(--ruby-color);font-family:"Baloo 2",sans-serif;
}
@media (max-width:640px){.reading-text{font-size:20px;line-height:2.4;}}
.word-table{width:100%;border-collapse:separate;border-spacing:0;margin-top:10px;}
.word-table th{background:var(--primary);color:#fff;padding:8px;font-size:13px;}
.word-table th:first-child{border-radius:12px 0 0 0;}
.word-table th:last-child{border-radius:0 12px 0 0;}
.word-table td{padding:8px;font-size:14px;border-bottom:1px solid var(--card-border);vertical-align:top;}
.word-table tr:nth-child(even) td{background:var(--card2);}
.word-table .w{font-size:16px;font-weight:700;color:var(--primary);}
.word-table .p{color:var(--ruby-color);font-family:"Baloo 2",sans-serif;font-size:13px;}

/* ===== TTS 面板 ===== */
.tts-controls{
  display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;
}
.btn{
  border:none;padding:10px 16px;border-radius:16px;font-family:inherit;
  font-size:14px;font-weight:700;cursor:pointer;color:#fff;
  box-shadow:0 4px 0 rgba(0,0,0,.15);transition:transform .1s, box-shadow .1s;
  display:inline-flex;align-items:center;gap:6px;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-play{background:var(--accent2);color:#1f3d1f;box-shadow:0 4px 0 #6ba96b;}
.btn-follow{background:var(--secondary);box-shadow:0 4px 0 #4d96c4;}
.btn-pause{background:var(--accent);color:#4a3b4d;box-shadow:0 4px 0 #d1ae3a;}
.btn-stop{background:#ff6b6b;box-shadow:0 4px 0 #c24444;}
.btn-dl{background:var(--tag5);box-shadow:0 4px 0 #9d74d1;}
.slider-row{display:flex;align-items:center;gap:10px;margin:10px 0;flex-wrap:wrap;}
.slider-row label{font-size:14px;font-weight:700;min-width:80px;}
.slider-row input[type=range]{flex:1;min-width:140px;accent-color:var(--primary);}
.rate-val{font-family:"Baloo 2",sans-serif;font-weight:700;color:var(--primary);min-width:42px;}
select{
  font-family:inherit;font-size:14px;padding:8px 12px;border-radius:14px;
  border:2px solid var(--card-border);background:var(--card);color:var(--text);
  font-weight:700;outline:none;
}
.tts-textareas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
@media (max-width:640px){.tts-textareas{grid-template-columns:1fr;}}
.tts-textareas textarea{
  width:100%;min-height:140px;border:2px solid var(--card-border);border-radius:14px;
  padding:10px;font-family:"Baloo 2",sans-serif;font-size:14px;
  background:var(--card2);color:var(--text);resize:vertical;outline:none;line-height:1.6;
}
.tts-textareas textarea.hanzi{font-family:var(--hanzi-font);font-size:16px;line-height:1.8;}
.tts-status{
  background:var(--card2);padding:8px 14px;border-radius:12px;font-size:13px;
  color:var(--muted);border-left:4px solid var(--primary);margin:8px 0;
}
.tts-status.ok{border-left-color:var(--accent2);color:#1f3d1f;}
.tts-status.warn{border-left-color:var(--accent);color:#7a5a00;}
.tts-status.err{border-left-color:#ff6b6b;color:#a83535;}
.progress-bar{
  height:8px;background:var(--card2);border-radius:4px;overflow:hidden;margin:6px 0;
  border:1px solid var(--card-border);
}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));
  border-radius:4px;transition:width .2s;}

/* ===== 空态/欢迎 ===== */
.empty{text-align:center;padding:40px 10px;color:var(--muted);}
.empty .big{font-size:56px;margin-bottom:10px;}

/* ===== 小彩蛋：输入时星星 ===== */
.sparkle{position:fixed;pointer-events:none;font-size:18px;z-index:9999;
  animation:sparkle .8s ease-out forwards;}
@keyframes sparkle{
  0%{opacity:1;transform:translateY(0) scale(1);}
  100%{opacity:0;transform:translateY(-40px) scale(1.6) rotate(20deg);}
}
</style>
</head>
<body data-theme="candy" data-font="cute">
<div class="container">
  <!-- 头部 -->
  <div class="header">
    <div class="mascot" id="mascot">🐻</div>
    <div class="title">欢乐伙伴 · 华文小助手</div>
    <div class="subtitle">查字 · 查词 · 读课文 · 听朗读 🌈 1A — 3B</div>
  </div>

  <!-- 顶部工具栏：字体切换 + 主题切换 -->
  <div class="toolbar">
    <button class="tool-btn" id="fontToggle" title="切换字体">🎨 卡通字</button>
    <div class="theme-menu" id="themeMenu">
      <button class="tool-btn" id="themeBtn" title="切换配色">🎨 粉彩糖果</button>
      <div class="theme-dropdown" id="themeDropdown">
        <button data-theme="candy" class="active">🌈 粉彩糖果（默认）</button>
        <button data-theme="morandi">🍵 莫兰迪低饱和</button>
        <button data-theme="bw">◼️ 黑白护眼</button>
      </div>
    </div>
  </div>

  <!-- 搜索栏 -->
  <div class="search-wrap">
    <div class="search-bar">
      <input type="text" id="q" placeholder="输入生字或词语，例如：家、巴士、小鱼..." autocomplete="off">
      <button id="searchBtn">🔍 找找看</button>
    </div>
    <div class="hint-row">
      <span class="chip" onclick="setQ('家')">试：家</span>
      <span class="chip" onclick="setQ('阿姨')">试：阿姨</span>
      <span class="chip" onclick="setQ('巴士')">试：巴士</span>
      <span class="chip" onclick="randomPick()" title="随机一字">🎲 随便考考我</span>
    </div>
  </div>

  <!-- Tab -->
  <div class="tabs">
    <div class="tab active" data-tab="search"><span class="emo">🔍</span><span class="tlabel">查字词</span></div>
    <div class="tab" data-tab="read"><span class="emo">📖</span><span class="tlabel">读课文</span></div>
    <div class="tab" data-tab="tts"><span class="emo">🔊</span><span class="tlabel">听课文</span></div>
  </div>

  <!-- 主区域 -->
  <div id="panel-search" class="panel">
    <div class="empty" id="welcome">
      <div class="big">📚</div>
      <div>在上方输入一个生字或词语，开始学习吧！</div>
      <div style="margin-top:8px;font-size:13px;">输入一个字，可以看到它的拼音、词语和出现在哪些课文句子里；</div>
      <div style="font-size:13px;">输入词语，可以看到它的拼音、解释和出现在哪些句子里。</div>
    </div>
    <div id="result"></div>
  </div>

  <div id="panel-read" class="panel" style="display:none;"></div>
  <div id="panel-tts" class="panel" style="display:none;"></div>
</div>

<!-- 数据脚本 -->
<script src="data.js"></script>
<script src="tts.js"></script>
<script>
/* ============================================================
   欢乐伙伴 · 华文小助手 - JS
   ============================================================ */
const D = window.HB_DATA;
const T = window.TTS_MANIFEST; // tts.js 的全局变量名是 TTS_MANIFEST

const MASCOTS = ['🐻','🐼','🐯','🦊','🐰','🐨','🐱','🐶','🐵','🦁','🐮','🐸'];
const BOOK_EMOJI = {'1A':'🌱','1B':'🐣','2A':'🌈','2B':'🐠','3A':'🚀','3B':'⭐'};
const TAG_COLORS = ['c1','c2','c3','c4','c5','c6'];

/* ---------- 工具函数 ---------- */
const $ = id => document.getElementById(id);
const escapeHtml = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isPunct = c => /^[，。！？、：；""''（）《》【】“”‘’…—·,.!?;:\-—()\[\]{} ]$/.test(c);

function pickMascot(){$('mascot').textContent = MASCOTS[Math.floor(Math.random()*MASCOTS.length)];}

/* ---------- 构建句子索引 ---------- */
// 所有句子展平：{bid,lno,title,sidx,text,pinyin}
let ALL_SENTENCES = [];
let SENT_INDEX = {}; // key = book_lno_sidx
function buildSentences(){
  D.book_order.forEach(bid=>{
    const lessons = D.lessons_by_book[bid] || [];
    lessons.forEach(L=>{
      if(!L.tokens) return;
      let sentIdx = 0;
      L.tokens.forEach(line=>{
        // 空行跳过
        const words = line.filter(tok=>tok[0] && tok[0].trim());
        if(!words.length) return;
        const text = words.map(w=>w[0]).join('').replace(/([，。！？、])/g,'$1 ').replace(/\s+$/,'');
        const pinyin = words.map(w=>w[1]||'').filter(Boolean).join(' ');
        const key = `${bid}_${L.lesson_no}_${sentIdx}`;
        const obj = {bid,lno:L.lesson_no,title:L.title,sentIdx,text,pinyin,key};
        ALL_SENTENCES.push(obj);
        SENT_INDEX[key] = obj;
        sentIdx++;
      });
    });
  });
}

function findOccurrences(query, isChar){
  const q = query;
  const seen = new Set();
  const out = [];
  ALL_SENTENCES.forEach(s=>{
    if(!s.text.includes(q)) return;
    if(seen.has(s.key)) return;
    // 如果查询单字，要避免把词中的字重复计数多次出现（同一句只记一次）
    seen.add(s.key);
    out.push(s);
  });
  return out;
}

function findSentencesContainingWord(w){
  return findOccurrences(w, false);
}

/* ---------- 拼音标注（单字 ruby） ---------- */
function rubyTextHtml(sentObj){
  // sentObj.tokens 不在索引里；我们从 text 逐字加 ruby —— 用 pypinyin 不现实
  // 所以用词语表/生字表查找每个字的读音；找不到的字就不加拼音
  return rubyForSentence(sentObj.text);
}
// 简易：遍历所有词，做最长匹配，给每个词套 ruby（用该词拼音）。匹配不到的单字不加拼音。
function rubyForSentence(text){
  // 构造一个按长度倒序的词表
  const vocab = [];
  // 优先词表 words
  Object.keys(D.word_lookup||{}).forEach(w=>{
    if(D.word_lookup[w].pinyin) vocab.push([w,D.word_lookup[w].pinyin]);
  });
  Object.keys(D.char_index||{}).forEach(ch=>{
    vocab.push([ch,D.char_index[ch].pinyin]);
  });
  vocab.sort((a,b)=>b[0].length-a[0].length);
  let i=0;
  let html='';
  while(i<text.length){
    let matched=false;
    if(isPunct(text[i])){
      html += escapeHtml(text[i]);
      i++; continue;
    }
    for(const [w,py] of vocab){
      if(text.startsWith(w,i)){
        html += `<ruby>${escapeHtml(w)}<rt>${escapeHtml(py)}</rt></ruby>`;
        i += w.length;
        matched=true; break;
      }
    }
    if(!matched){
      html += escapeHtml(text[i]);
      i++;
    }
  }
  return html;
}

/* ---------- 高亮搜索词 ---------- */
function highlight(text, q){
  const esc = escapeHtml(text);
  const eq = escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return esc.replace(new RegExp(eq,'g'), m=>`<mark class="hl">${m}</mark>`);
}

/* ---------- 搜索主逻辑 ---------- */
function doSearch(){
  const q = $('q').value.trim();
  const resBox = $('result');
  const welcome = $('welcome');
  if(!q){welcome.style.display='block';resBox.innerHTML='';switchTab('search');return;}
  welcome.style.display='none';
  sparkleEffect();

  const isChar = q.length === 1 && !isPunct(q);
  const isWord = D.word_lookup && D.word_lookup[q];
  const charInfo = isChar ? (D.char_index && D.char_index[q]) : null;

  let html = '';

  if(isChar && charInfo){
    // 单字：大字 + 拼音 + 组词 + 出现句子
    const word = charInfo.word || q;
    const wp = charInfo.word_pinyin || '';
    const expl = charInfo.explanation || '';
    const bookLabel = `${BOOK_EMOJI[charInfo.book]||'📘'} ${charInfo.book} · 第${charInfo.lesson_no}课`;
    const occ = findOccurrences(q, true);
    html += `
      <div class="card">
        <div class="result-head">
          <div class="bigchar">${escapeHtml(q)}</div>
          <div class="info-list">
            <div class="pinyin">${escapeHtml(charInfo.pinyin||'')}</div>
            <div>组词：<span class="bigword">${escapeHtml(word)}</span>
              <span class="pinyin" style="font-size:16px;margin-left:8px;">${escapeHtml(wp)}</span>
            </div>
            <div style="color:var(--muted);font-size:14px;">${escapeHtml(expl)}</div>
            <div><span class="tag c3">首次出现：${escapeHtml(bookLabel)}</span>
              <span class="tag c5">课文出现 ${occ.length} 次</span></div>
          </div>
        </div>
        ${renderRelatedChars(q,word)}
        ${renderOccurrences(occ, q)}
      </div>`;
  } else if(isWord){
    // 词：大词头 + 拼音 + 解释 + 出现句子
    const info = D.word_lookup[q];
    const first = info.first_lesson || '';
    const occ = findSentencesContainingWord(q);
    const chChars = [...q].filter(c=>!isPunct(c));
    const charTags = chChars.map(c=>{
      const ci = D.char_index && D.char_index[c];
      return `<span class="tag c2" onclick="setQ('${c}')">${escapeHtml(c)} ${ci?ci.pinyin:''}</span>`;
    }).join('');
    html += `
      <div class="card">
        <div class="result-head">
          <div class="bigword">${escapeHtml(q)}</div>
          <div class="info-list">
            <div class="pinyin">${escapeHtml(info.pinyin||'')}</div>
            <div style="color:var(--muted);font-size:14px;">${escapeHtml(info.explanation||'')}</div>
            <div>${first?`<span class="tag c3">首次出现：${escapeHtml(first)}</span>`:''}
              <span class="tag c5">课文出现 ${occ.length} 次</span></div>
            <div style="margin-top:4px;">${charTags}</div>
          </div>
        </div>
        ${renderOccurrences(occ, q)}
      </div>`;
  } else {
    // 未在词表/字表中：尝试从句子里找
    const occ = findOccurrences(q, q.length===1);
    if(occ.length){
      html += `
        <div class="card">
          <div class="result-head">
            <div class="bigword">${escapeHtml(q)}</div>
            <div class="info-list">
              <div style="color:var(--muted);font-size:14px;">这个词不在生字表中，但在课文里出现了 ${occ.length} 次：</div>
            </div>
          </div>
          ${renderOccurrences(occ, q)}
        </div>`;
    } else {
      // 模糊推荐
      html += `
        <div class="card">
          <div class="empty">
            <div class="big">🤔</div>
            <div>没有找到"${escapeHtml(q)}"，试试下面这些：</div>
            <div style="margin-top:10px;">${renderSuggestions(q)}</div>
          </div>
        </div>`;
    }
  }

  resBox.innerHTML = html;
  switchTab('search');
}

function renderRelatedChars(ch, word){
  // 找含这个字的其他词
  const related = [];
  if(D.word_lookup){
    Object.keys(D.word_lookup).forEach(w=>{
      if(w!==word && w.includes(ch) && w.length>=2) related.push(w);
    });
  }
  // 只显示前12个
  const list = related.slice(0,12);
  if(!list.length) return '';
  return `<div class="related-wrap">
    <div style="font-size:13px;color:var(--muted);margin-top:8px;">更多含"${escapeHtml(ch)}"的词语：</div>
    <div>${list.map((w,i)=>{
      const info = D.word_lookup[w];
      return `<span class="tag ${TAG_COLORS[i%TAG_COLORS.length]}" onclick="setQ('${escapeHtml(w).replace(/'/g,"\\'")}')">${escapeHtml(w)} ${info?info.pinyin:''}</span>`;
    }).join('')}</div>
  </div>`;
}

function renderOccurrences(occ, q){
  if(!occ.length) return '';
  // 按课分组
  const groups = {};
  occ.forEach(s=>{
    const k = `${s.bid}_${s.lno}`;
    if(!groups[k]) groups[k] = {bid:s.bid,lno:s.lno,title:s.title,items:[]};
    groups[k].items.push(s);
  });
  const keys = Object.keys(groups);
  let html = `<div class="section-title">📖 课文中出现（共 ${occ.length} 句）</div>`;
  keys.forEach(k=>{
    const g = groups[k];
    const color = TAG_COLORS[D.book_order.indexOf(g.bid)%TAG_COLORS.length];
    html += `
      <div class="occ-group">
        <div class="occ-group-head">
          <span class="tag ${color}">${BOOK_EMOJI[g.bid]||'📘'} ${g.bid} · 第${g.lno}课 ${escapeHtml(g.title)}</span>
          <span class="occ-count">${g.items.length} 句</span>
        </div>
        <div class="occ-body">
          ${g.items.map(s=>`
            <div class="sentence-card">
              <div class="stext">${highlight(s.text, q)}</div>
              <div class="spiny">${escapeHtml(s.pinyin||'')}</div>
            </div>`).join('')}
        </div>
      </div>`;
  });
  return html;
}

function renderSuggestions(q){
  const cands = [];
  if(D.word_lookup){
    Object.keys(D.word_lookup).forEach(w=>{
      if(w.includes(q)||q.includes(w)) cands.push(w);
    });
  }
  if(D.char_index){
    [...q].forEach(c=>{if(D.char_index[c]) cands.push(c);});
  }
  const uniq = [...new Set(cands)].slice(0,18);
  if(!uniq.length) return '<span style="color:var(--muted);">换一个词试试看？</span>';
  return uniq.map((w,i)=>`<span class="tag ${TAG_COLORS[i%TAG_COLORS.length]}" onclick="setQ('${escapeHtml(w).replace(/'/g,"\\'")}')">${escapeHtml(w)}</span>`).join('');
}

function setQ(v){
  $('q').value = v;
  doSearch();

function buildQueueFromText(){
  // 全文模式：按句切分（句末标点换行视为句末）
  // 逐词模式：按词切分（空格分隔）
  _fullQueue = splitSentences($('hanziArea').value);
  _followQueue = splitWords($('hanziArea').value);

function splitSentences(txt){
  // 按 。！？\n 切分
  return txt.split(/(?<=[。！？])|\n+/).map(s=>s.trim()).filter(Boolean);
}
function splitWords(txt){
  // 先按句切，再按空格切
  const sents = splitSentences(txt);
  const out=[];
  sents.forEach(s=>{
    const parts = s.split(/\s+/).filter(Boolean);
    parts.forEach(p=>out.push(p));
    out.push('__PAUSE_SENT__');
  });
  return out;
}
function splitWordsFollowOnly(txt){
  return txt.split(/\s+/).filter(Boolean);
}

function loadVoices(){
  const voices = speechSynthesis.getVoices();
  const sel = $('voiceSel');
  if(!sel) return;
  // 分组：普通话 / 粤台 / 其他
  const zh_cn=[],zh_other=[],other=[];
  voices.forEach(v=>{
    const lang = (v.lang||'').toLowerCase();
    const name = v.name||'';
    if(lang.startsWith('zh')){
      if(lang.includes('cn') || /mandarin|普通话|xiaoxiao|yunxi|yunyang|yunjian|xiaoyi|xiaomo|huihui|yaoyao|kangkang/i.test(name) || (!lang.includes('tw')&&!lang.includes('hk')&&!lang.includes('yue'))){
        zh_cn.push(v);
      } else {
        zh_other.push(v);
      }
    } else {other.push(v);}
  });
  let html = '';
  if(zh_cn.length) html += `<optgroup label="✅ 普通话（推荐）">${zh_cn.map(v=>`<option value="${v.name}">✅ ${v.name} (${v.lang})</option>`).join('')}</optgroup>`;

    if(target){selectVoice(target.name);}
  } else {
    selectVoice(_selectedVoice.name);

  updateVoiceHint();
}

    hint.className='tts-status ok';
    hint.innerHTML=`✅ 当前语音：<b>${name}</b>（${_selectedVoice.lang}）—— 普通话，适合朗读课文`;
  } else if(lang.includes('yue')||lang.includes('hk')||/cantonese|粤语|hong kong/i.test(name)){
    hint.className='tts-status warn';
    hint.innerHTML=`⚠️ 当前语音：<b>${name}</b>（${_selectedVoice.lang}）—— 是粤语哦，建议切换到上面带 ✅ 的普通话声音`;
  } else if(lang.includes('tw')){
    hint.className='tts-status warn';
    hint.innerHTML=`⚠️ 当前语音：<b>${name}</b>（${_selectedVoice.lang}）—— 是台湾国语，建议切换到带 ✅ 的普通话`;
  } else if(lang.startsWith('en')){
    hint.className='tts-status err';
    hint.innerHTML=`❌ 当前语音：<b>${name}</b>（${_selectedVoice.lang}）—— 英语，会把中文读成奇怪的音，请换一个 ✅ 普通话声音`;
  } else {
    hint.className='tts-status warn';
    hint.innerHTML=`ℹ️ 当前语音：<b>${name}</b>（${_selectedVoice.lang}）—— 如果读出来不对，请换一个 ✅ 普通话`;
  }
}
function speakString(str){
  if(!str) return;
  _ttsMode = 'free';
  _ttsQueue = splitSentences(str);
  _ttsIndex = 0;
  _ttsPaused = false;
  _tts = speechSynthesis;
  _tts.cancel();
  speakOne(0);
}
function startPlay(mode){
  if(!speechSynthesis) return;
  buildQueueFromText();
  _ttsMode = mode;
  _ttsQueue = (mode==='follow') ? _followQueue : _fullQueue;
  _ttsIndex = 0;
  _ttsPaused = false;
  _tts = speechSynthesis;
  _tts.cancel();
  setStatus('ok', mode==='follow'?'🐢 逐词跟读开始，跟着屏幕上的拼音一起念吧！':'▶️ 开始朗读');
  updateProgress();
  speakOne(0);
}
let _currentUtter=null;
function speakOne(i){
  if(!_tts) return;
  if(i>=_ttsQueue.length){setStatus('ok','🎉 读完啦！');updateProgress(1);return;}
  _ttsIndex = i;
  let seg = _ttsQueue[i];
  if(seg==='__PAUSE_SENT__'){
    // 句末停顿
    _currentUtter = null;
    updateProgress();
    setTimeout(()=>{if(!_ttsPaused) speakOne(i+1);}, 700);
    return;
  }
  const u = new SpeechSynthesisUtterance(seg);
  if(_selectedVoice) u.voice = _selectedVoice;
  u.lang = _selectedVoice?_selectedVoice.lang:'zh-CN';
  u.rate = parseFloat($('rate').value);
  u.pitch = 1.1;
  u.onend = ()=>{
    _currentUtter = null;
    if(_ttsPaused) return;
    if(_ttsMode==='follow'){
      setTimeout(()=>{if(!_ttsPaused) speakOne(i+1);}, 350);
    } else {
      const pauseMs = /[，、；：]/.test(seg)?350 : (/[。！？]/.test(seg)?700:0);
      if(pauseMs) setTimeout(()=>{if(!_ttsPaused) speakOne(i+1);},pauseMs);
      else speakOne(i+1);
    }
    updateProgress();
  };
  u.onerror = ()=>{_currentUtter=null;};
  _currentUtter = u;
  _tts.speak(u);
  updateProgress();
}
function togglePause(){
  if(!_tts) return;
  if(_ttsPaused){
    _tts.resume();
    _ttsPaused = false;
    setStatus('ok','▶️ 继续朗读');
    $('btnPause').textContent = '⏸️ 暂停';
  } else {
    _tts.pause();
    _ttsPaused = true;
    setStatus('warn','⏸️ 已暂停，点"继续"接着读');
    $('btnPause').textContent = '▶️ 继续';
  }
}
function stopPlay(){
  if(_tts){_tts.cancel();_ttsPaused=false;_ttsIndex=0;_currentUtter=null;}
  setStatus('ok','⏹ 已停止');
  $('btnPause').textContent = '⏸️ 暂停';
  updateProgress(0);
}
function updateProgress(force){
  const bar = $('prog');
  if(!bar) return;
  const total = _ttsQueue?_ttsQueue.length:0;
  const p = (typeof force==='number')?force:(total? Math.min(1, _ttsIndex/total) :0);
  bar.style.width = (p*100).toFixed(1)+'%';
}
function setStatus(type,msg){
  const s = $('ttsStatus'); if(!s) return;
  s.className='tts-status '+type; s.textContent=msg;
}

function copyText(id){
  const el = $(id); el.select(); document.execCommand('copy');
  setStatus('ok','📋 已复制到剪贴板');
}
function downloadTxt(kind){
  const bid = $('ttsBook').value;
  const lno = parseInt($('ttsLesson').value);
  const item = T.find(x=>x.book===bid && x.lesson_no===lno);
  if(!item) return;
  const content = kind==='pinyin'?item.pinyin_text:item.hanzi_text;
  const ext = kind==='pinyin'?'pinyin':'hanzi';
  const fname = `${bid}_L${String(lno).padStart(2,'0')}_${(item.title||'').replace(/[《》"']/g,'')}_${ext}.txt`;
  const blob = new Blob([content],{type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fname; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function savePrefs(){
  localStorage.setItem('tts_rate',$('rate').value);
  if(_selectedVoice) localStorage.setItem('tts_voice',_selectedVoice.name);
}
function loadPrefs(){
  const r = localStorage.getItem('tts_rate'); if(r && $('rate')){$('rate').value=r;$('rateVal').textContent=Number(r).toFixed(2)+'x';}
  const v = localStorage.getItem('tts_voice'); if(v) selectVoice(v);
  const th = localStorage.getItem('theme'); if(th) setTheme(th);
  const fn = localStorage.getItem('font'); if(fn) setFont(fn);
}

/* ---------- 主题切换 ---------- */
const THEMES = {
  candy: {label:'🎨 粉彩糖果', btn:'🎨 粉彩糖果'},
  morandi: {label:'🍵 莫兰迪低饱和', btn:'🍵 莫兰迪'},
  bw: {label:'◼️ 黑白护眼', btn:'◼️ 黑白护眼'},
};
function setTheme(name){
  if(!THEMES[name]) name='candy';
  document.body.setAttribute('data-theme',name);
  localStorage.setItem('theme',name);
  // 更新下拉选中状态
  document.querySelectorAll('#themeDropdown button').forEach(b=>{
    b.classList.toggle('active', b.dataset.theme===name);
  });
  $('themeBtn').textContent = THEMES[name].btn;
  $('themeMenu').classList.remove('open');
}
function initTheme(){
  $('themeBtn').addEventListener('click',(e)=>{
    e.stopPropagation();
    $('themeMenu').classList.toggle('open');
  });
  document.addEventListener('click',(e)=>{
    if(!$('themeMenu').contains(e.target)) $('themeMenu').classList.remove('open');
  });
  document.querySelectorAll('#themeDropdown button').forEach(b=>{
    b.addEventListener('click',()=>setTheme(b.dataset.theme));
  });
}

/* ---------- 字体切换 ---------- */
function setFont(mode){
  document.body.setAttribute('data-font',mode);
  localStorage.setItem('font',mode);
  $('fontToggle').textContent = (mode==='kai')?'✒️ 楷体字':'🎨 卡通字';
}
function initFont(){
  $('fontToggle').addEventListener('click',()=>{
    const cur = document.body.getAttribute('data-font')||'cute';
    setFont(cur==='cute'?'kai':'cute');
  });
}

/* ---------- 星星彩蛋 ---------- */
function sparkleEffect(){
  const emojis=['✨','⭐','🌟','💫','🎉'];
  for(let i=0;i<5;i++){
    const s=document.createElement('span');
    s.className='sparkle';
    s.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    const x=Math.random()*window.innerWidth;
    const y=window.innerHeight-80-Math.random()*120;
    s.style.left=x+'px';s.style.top=y+'px';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),900);
  }
}

/* ---------- 初始化 ---------- */
window.addEventListener('DOMContentLoaded',()=>{
  pickMascot();
  buildSentences();
  initTheme();
  initFont();
  $('searchBtn').addEventListener('click',doSearch);
  $('q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});
  $('q').addEventListener('input',()=>{if($('q').value.length>=1)setTimeout(doSearch,80);});
  loadPrefs();
  // 默认在搜索 tab
  switchTab('search');
});
</script>
