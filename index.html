<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🌈 欢乐伙伴·华文小乐园（1A-3B）</title>
<style>
:root{--bg1:#fff8ee;--bg2:#ffe9f1;--bg3:#e8f6ff;--bg4:#eafff1;--card:#ffffffcc;--text:#4a3a3a;--muted:#9a7d7d;--accent:#ff8aaf;--accent2:#78c4e8;--accent3:#ffd66b;--accent4:#a8d8a8;--accent5:#d6a8e8;--shadow:0 6px 22px rgba(255,150,180,.18);--font-display:"ZCOOL KuaiLe","Ma Shan Zheng","Kaiti","KaiTi",system-ui,sans-serif;--font-body:"ZCOOL KuaiLe","Ma Shan Zheng","Kaiti","KaiTi",system-ui,sans-serif;--font-pinyin:"Baloo 2","Comic Sans MS",cursive;--r:22px}
body.kaiti{--font-body:"KaiTi","STKaiti","楷体",serif;--font-display:"KaiTi","STKaiti","楷体",serif}
body.theme-morandi{--bg1:#f3eee6;--bg2:#e9dfd4;--bg3:#d8e0e2;--bg4:#e0e2d4;--card:#f8f4eccc;--text:#4b463f;--muted:#8a8276;--accent:#c99e8f;--accent2:#8eabae;--accent3:#d4c185;--accent4:#a8b894;--accent5:#b69fc1;--shadow:0 6px 22px rgba(140,120,100,.18)}
body.theme-bw{--bg1:#ffffff;--bg2:#f0f0f0;--bg3:#e8e8e8;--bg4:#efefef;--card:#ffffff;--text:#222;--muted:#777;--accent:#555;--accent2:#888;--accent3:#aaa;--accent4:#999;--accent5:#666;--shadow:0 4px 14px rgba(0,0,0,.08)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font-body);background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 30%,var(--bg3) 70%,var(--bg4) 100%);background-attachment:fixed;color:var(--text);min-height:100vh;padding-bottom:90px;transition:background .5s ease,color .3s ease}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(circle at 15% 20%,rgba(255,200,220,.35) 0,transparent 40%),radial-gradient(circle at 85% 10%,rgba(180,220,255,.35) 0,transparent 40%),radial-gradient(circle at 50% 85%,rgba(255,230,170,.3) 0,transparent 40%);z-index:-1;animation:float 14s ease-in-out infinite alternate}
@keyframes float{0%{transform:translateY(0)}100%{transform:translateY(-14px)}}
.wrap{max-width:1100px;margin:0 auto;padding:16px 14px 24px}
.header{text-align:center;padding:14px 0 10px;position:relative}
.mascot{font-size:42px;animation:bob 2.4s ease-in-out infinite;display:inline-block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.08))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
h1{margin:4px 0 6px;font-family:var(--font-display);font-size:34px;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent5));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.sub{color:var(--muted);font-size:15px;margin-bottom:10px}
.toolbar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px 0 14px}
.tool-btn{border:none;border-radius:999px;padding:8px 16px;font-family:var(--font-body);font-size:15px;cursor:pointer;background:var(--card);color:var(--text);box-shadow:var(--shadow);transition:all .2s}
.tool-btn:hover{transform:translateY(-2px) scale(1.03)}
.tool-btn:active{transform:translateY(1px) scale(.98)}
.theme-menu{position:relative;display:inline-block}
.theme-dropdown{display:none;position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--card);backdrop-filter:blur(8px);border-radius:16px;padding:8px;box-shadow:var(--shadow);z-index:50;min-width:160px}
.theme-menu.open .theme-dropdown{display:block}
.theme-dropdown button{display:block;width:100%;border:none;background:transparent;padding:8px 14px;text-align:left;border-radius:10px;cursor:pointer;font-family:var(--font-body);font-size:15px;color:var(--text);white-space:nowrap}
.theme-dropdown button:hover{background:var(--bg2)}
.sticky{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg1),var(--bg1) 70%,transparent);padding:10px 0 6px}
.searchbox{display:flex;gap:8px;max-width:680px;margin:0 auto}
.searchbox input{flex:1;border:3px solid var(--accent);border-radius:999px;padding:12px 22px;font-size:18px;font-family:var(--font-body);background:var(--card);color:var(--text);outline:none;box-shadow:var(--shadow);transition:border .3s}
.searchbox input:focus{border-color:var(--accent2)}
.searchbox button{border:none;border-radius:999px;padding:10px 20px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:17px;cursor:pointer;font-family:var(--font-body);box-shadow:var(--shadow)}
.searchbox .lucky{background:linear-gradient(135deg,var(--accent3),var(--accent4));color:#6b4e1e}
.tabs{display:flex;gap:8px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.tab{padding:10px 18px;border-radius:999px;background:var(--card);cursor:pointer;color:var(--muted);font-size:17px;box-shadow:var(--shadow);transition:all .2s;border:none;font-family:var(--font-body)}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;transform:scale(1.05)}
.card{background:var(--card);backdrop-filter:blur(8px);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px;transition:background .5s}
h2{margin:6px 0 12px;font-size:22px;font-family:var(--font-display)}
.bigchar{font-size:86px;font-family:var(--font-display);background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent5));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;display:inline-block;vertical-align:middle;line-height:1;margin:0 10px 0 0;animation:pulse 3s ease-in-out infinite}
.bigemoji{font-size:70px;vertical-align:middle;display:inline-block;margin-left:8px;animation:wiggle 2.8s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(6deg) scale(1.06)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.bigpinyin{font-family:var(--font-pinyin);font-size:28px;color:var(--accent2);margin-left:10px}
.def{font-size:19px;margin:8px 0 4px;color:var(--text);line-height:1.6}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;font-size:14px;background:var(--accent3);color:#6b4e1e;margin:4px 4px 0 0}
.badge.b1{background:#ffe1ea;color:#c2507a}.badge.b2{background:#d4efff;color:#3878a6}.badge.b3{background:#fff1c4;color:#8a6b12}.badge.b4{background:#d8f0d8;color:#3e7a3e}.badge.b5{background:#ead8f5;color:#6b3f90}.badge.b6{background:#ffe0cc;color:#b85d2e}
.sent{padding:12px 16px;border-radius:14px;background:var(--bg4);margin:8px 0;font-size:19px;line-height:1.7;transition:background .5s}
.sent .meta{font-size:13px;color:var(--muted);margin-bottom:4px;display:block}
.sent .py{font-family:var(--font-pinyin);font-size:14px;color:var(--muted);margin-top:4px;display:block;line-height:1.5}
mark{background:linear-gradient(180deg,transparent 60%,#fff08a 60%);color:inherit;padding:0 2px;border-radius:3px}
.lesgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.lescard{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);cursor:pointer;transition:transform .2s,background .5s;border:none;text-align:left;font-family:var(--font-body);color:var(--text)}
.lescard:hover{transform:translateY(-4px) scale(1.02)}
.lescard .n{font-size:13px;color:var(--muted)}.lescard .t{font-size:20px;font-family:var(--font-display);margin-top:4px}
.lesson-body{font-size:22px;line-height:2;letter-spacing:1px}
.lesson-body ruby{margin:0 1px}
.lesson-body rt{font-family:var(--font-pinyin);font-size:12px;color:var(--accent2);font-weight:500}
.wordlist{width:100%;border-collapse:collapse;margin-top:10px}
.wordlist th,.wordlist td{padding:8px 10px;border-bottom:1px dashed var(--bg2);text-align:left;font-size:17px}
.wordlist th{color:var(--muted);font-size:14px;font-weight:normal}
.wordlist .w{font-family:var(--font-display);font-size:22px}.wordlist .p{font-family:var(--font-pinyin);color:var(--accent2);font-size:15px}
select,textarea{border:2px solid var(--accent2);border-radius:14px;padding:8px 12px;font-family:var(--font-body);font-size:16px;background:var(--card);color:var(--text);outline:none}
textarea{width:100%;min-height:140px;resize:vertical;line-height:1.8}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;align-items:center}
.controls .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:none;border-radius:999px;padding:10px 18px;font-family:var(--font-body);font-size:16px;cursor:pointer;box-shadow:var(--shadow);color:#fff;transition:all .15s}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.play{background:linear-gradient(135deg,var(--accent4),#6bb86b)}.btn.slow{background:linear-gradient(135deg,var(--accent3),#ffb84d);color:#5b3d00}
.btn.pause{background:linear-gradient(135deg,var(--accent2),#4d9fd1)}
.btn.stop{background:linear-gradient(135deg,#f08a8a,#d15959)}
.btn.small{padding:6px 12px;font-size:14px;background:var(--accent5)}
.rate{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
.rate input{width:160px;accent-color:var(--accent)}
.status{font-size:15px;color:var(--muted);padding:8px 14px;background:var(--bg3);border-radius:12px;margin:6px 0;display:inline-block;transition:background .5s}
.tts-textbox{margin-top:8px;position:relative}
.tts-textbox textarea{font-size:17px;line-height:1.8}
.tts-textbox mark{background:#fff3a0}
.progress{height:6px;background:var(--bg2);border-radius:999px;overflow:hidden;margin:6px 0 4px}
.progress > div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .2s}
.voicenote{font-size:13px;color:var(--muted);padding:4px 10px;border-radius:8px;background:var(--bg4);display:inline-block;margin-top:4px}
.related{margin-top:10px}.related .chip{display:inline-block;margin:4px;padding:6px 12px;background:var(--bg2);border-radius:999px;font-size:15px;cursor:pointer;transition:transform .15s;border:none;font-family:var(--font-body);color:var(--text)}
.related .chip:hover{transform:scale(1.08);background:var(--accent)}
.sparkle{position:fixed;font-size:22px;pointer-events:none;animation:pop .8s ease-out forwards;z-index:999}
@keyframes pop{0%{opacity:1;transform:scale(.3) translateY(0)}100%{opacity:0;transform:scale(1.3) translateY(-40px)}}
.bookchapters{margin-bottom:18px}
.bookchapters h3{margin:14px 0 8px;font-size:20px;font-family:var(--font-display);color:var(--accent)}
.hidden{display:none!important}
.navbottom{display:none}
@media (max-width:700px){
  .wrap{padding:10px 10px 20px}
  h1{font-size:26px}.bigchar{font-size:64px}.bigemoji{font-size:54px}
  .lesson-body{font-size:20px;line-height:2}
  .wordlist th,.wordlist td{padding:6px 6px;font-size:15px}
  .wordlist .w{font-size:18px}
  .lesgrid{grid-template-columns:repeat(2,1fr);gap:10px}
  .searchbox input{font-size:16px;padding:10px 16px}
  .navbottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);backdrop-filter:blur(10px);box-shadow:0 -4px 18px rgba(0,0,0,.08);z-index:30;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
  .navbottom button{flex:1;border:none;background:transparent;font-family:var(--font-body);font-size:13px;color:var(--muted);padding:6px 2px;cursor:pointer;border-radius:12px}
  .navbottom button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
  .tabs{display:none}
  .btn{padding:8px 14px;font-size:14px}.btn.small{padding:5px 10px;font-size:12px}
  .rate input{width:120px}
}
</style>
</head>
<body class="">
<div class="wrap">
<div class="header">
  <div class="mascot" id="mascot">🐻</div>
  <h1>欢乐伙伴 · 华文小乐园</h1>
  <div class="sub">小一到小三（1A-3B）· 查字 · 读课文 · 听朗读 · 共 71 课</div>
  <div class="toolbar">
    <button class="tool-btn" id="fontBtn" onclick="toggleFont()">🎨 卡通字</button>
    <div class="theme-menu" id="themeMenu">
      <button class="tool-btn" onclick="toggleThemeMenu(event)">🎨 粉彩糖果 ▾</button>
      <div class="theme-dropdown">
        <button onclick="setTheme('pastel',this)">🌈 粉彩糖果</button>
        <button onclick="setTheme('morandi',this)">🍵 莫兰迪</button>
        <button onclick="setTheme('bw',this)">◼️ 黑白护眼</button>
      </div>
    </div>
  </div>
</div>

<div class="sticky">
  <div class="searchbox">
    <input id="q" type="text" placeholder="🔍 输入字、词语或句子试试（例：家、巴士、小鱼）" onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">搜索</button>
    <button class="lucky" onclick="lucky()" title="随便考考我">🎲</button>
  </div>
  <div class="tabs">
    <button class="tab active" data-t="search" onclick="switchTab('search')">🔍 查字词</button>
    <button class="tab" data-t="browse" onclick="switchTab('browse')">📖 读课文</button>
    <button class="tab" data-t="tts" onclick="switchTab('tts')">🔊 听课文</button>
  </div>
</div>

<div id="tab-search">
  <div id="results"></div>
</div>

<div id="tab-browse" class="hidden">
  <div class="card">
    <h2>📖 按册选课文</h2>
    <div class="controls" id="bookTabs"></div>
  </div>
  <div id="lessonList"></div>
  <div id="lessonContent"></div>
</div>

<div id="tab-tts" class="hidden">
  <div class="card">
    <h2>🔊 听课文（TTS 朗读）</h2>
    <div class="controls">
      <label>册次：<select id="ttsBook" onchange="loadLessonsForTTS()"></select></label>
      <label>课次：<select id="ttsLesson" onchange="loadTTSText()"></select></label>
    </div>
    <div class="controls">
      <label class="rate">🗣️ 朗读语音：<select id="voiceSel" onchange="saveVoice()"></select></label>
      <span class="voicenote" id="voiceNote">正在检测声音…</span>
    </div>
    <div class="controls">
      <button class="btn play" onclick="playFull()">▶️ 朗读全文</button>
      <button class="btn slow" onclick="playFollow()">🐢 逐词跟读</button>
      <button class="btn pause" onclick="pauseResume()" id="pauseBtn">⏸️ 暂停</button>
      <button class="btn stop" onclick="stopTTS()">⏹ 停止</button>
      <label class="rate">⏩ 语速：<input id="rate" type="range" min="0.5" max="1.3" step="0.05" value="0.85" oninput="onRateChange()"><span id="rateVal">0.85x</span></label>
    </div>
    <div class="progress"><div id="prog"></div></div>
    <div class="status" id="ttsStatus">选好课后点按钮开始朗读 🎈</div>
    <div class="row" style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn small" onclick="copyText('pinyin')">📋 复制拼音</button>
      <button class="btn small" onclick="copyText('hanzi')">📋 复制汉字</button>
      <button class="btn small" onclick="downloadTxt('pinyin')">⬇️ 拼音.txt</button>
      <button class="btn small" onclick="downloadTxt('hanzi')">⬇️ 汉字.txt</button>
    </div>
    <div class="tts-textbox">
      <h2>拼音文本</h2>
      <textarea id="ttsPinyin" readonly></textarea>
    </div>
    <div class="tts-textbox">
      <h2>汉字文本（点击字跟看）</h2>
      <textarea id="ttsHanzi" readonly></textarea>
    </div>
    <p style="font-size:13px;color:var(--muted);margin-top:10px">
      💡 使用提示：<br>
      ①【朗读全文】用普通话正常语速读完整篇课文；<br>
      ②【逐词跟读】一个词一个词慢慢读，中间停顿，看着上面的拼音跟着念；<br>
      ③ 如果听到广东话/台湾腔/英语，在「🗣️ 朗读语音」里换一个带 ✅ 的；<br>
      ④ 播放中拖动「语速」滑杆会立刻生效，按「暂停」可以在当前词停住，按「继续」接着读。
    </p>
  </div>
</div>
</div>

<div class="navbottom">
  <button data-t="search" class="active" onclick="switchTab('search')">🔍<br>查字词</button>
  <button data-t="browse" onclick="switchTab('browse')">📖<br>读课文</button>
  <button data-t="tts" onclick="switchTab('tts')">🔊<br>听课文</button>
</div>

<script src="data.js"></script>
<script src="tts.js"></script>
<script>

function getEmoji(ch){
  if(EMOJI_MAP[ch]) return EMOJI_MAP[ch];
  // 根据部首/简单规则猜
  if(/[猫狗猪狐狼狮]/.test(ch)) return '🐾';
  if(/[鸡鸭鹅鸽鸦]/.test(ch)) return '🐦';
  if(/[花草苗茶莓]/.test(ch)) return '🌿';
  if(/[树林森桃柳橘梅杏]/.test(ch)) return '🌳';
  if(/[江海河湖波浪游泳池]/.test(ch)) return '🌊';

}

const charIndex=D.char_index||{};
const wordLookup=D.word_lookup||{};
const lessonIndex=D.lesson_index||{};

function findOccurrences(needle){
  const out=[];
  for(const key in lessonIndex){
    const L=lessonIndex[key];
    const book=key.split('_')[0], no=parseInt(key.split('_')[1]);
    for(let si=0;si<L.sentences.length;si++){
      const s=L.sentences[si];
      if(s.hanzi.indexOf(needle)!==-1){
        out.push({book,lesson:no,title:L.title,sentence:s.hanzi,pinyin:s.pinyin,si});
      }
    }
  }
  return out;
}
function findSentencesContaining(word){
  const out=[];
  for(const key in lessonIndex){
    const L=lessonIndex[key];
    const book=key.split('_')[0], no=parseInt(key.split('_')[1]);
    for(let si=0;si<L.sentences.length;si++){
      const s=L.sentences[si];
      if(s.hanzi.indexOf(word)!==-1) out.push({book,lesson:no,title:L.title,sentence:s.hanzi,pinyin:s.pinyin});
    }
  }
  return out;
}

function highlight(s,q){return s.split(q).join('<mark>'+q+'</mark>')}
function doSearch(){
  const q=document.getElementById('q').value.trim();
  const box=document.getElementById('results');
  if(!q){box.innerHTML='<div class="card">👆 在上面的搜索框里输入一个字或词语～比如"家""巴士""小鱼"。</div>';return}
  sparkle();
  let html='';
  // 单字
  if(q.length===1){
    const ci=charIndex[q];
    const em=getEmoji(q);
    html+='<div class="card"><div style="display:flex;align-items:center;flex-wrap:wrap"><span class="bigchar">'+q+'</span>'+(em?'<span class="bigemoji">'+em+'</span>':'')+(ci?'<span class="bigpinyin">'+ci.pinyin+'</span>':'')+'</div>';
    if(ci){
      html+='<div class="def"><b>常用词：</b><span style="font-family:var(--font-display);font-size:26px;color:var(--accent)">'+ci.word+'</span> <span class="bigpinyin" style="font-size:20px">'+ci.word_pinyin+'</span></div>';
      html+='<div class="def"><b>意思：</b>'+ci.explanation+'</div>';
      html+='<div><span class="badge b1">'+BOOK_EMOJI[ci.book]+' '+ci.book+' 第'+ci.lesson_no+'课 学</span></div>';
    }else{
      html+='<div class="def">这个字不在"我会认"生字表里，但我们也帮你找一找它在哪些课文里出现 🔎</div>';
    }
    const occ=findOccurrences(q);
    html+='<h2 style="margin-top:14px">📌 这个字在课文里一共出现 '+occ.length+' 次</h2>';
    html+=renderOcc(occ,q);
    // 相关词
    const related=[];
    for(const w in wordLookup){if(w.indexOf(q)!==-1 && w!==q && w.length>=2) related.push(w)}
    if(related.length){
      html+='<div class="related"><b style="font-size:15px;color:var(--muted)">🔗 更多带「'+q+'」的词语：</b><br>';
      related.slice(0,24).forEach(w=>{html+='<button class="chip" onclick="document.getElementById(\'q\').value=\''+w+'\';doSearch()">'+w+'</button>'});
      html+='</div>';
    }
    html+='</div>';
  }else{
    // 词语
    const wl=wordLookup[q];
    const em=getEmoji(q);
    html+='<div class="card"><div style="display:flex;align-items:center;flex-wrap:wrap"><span class="bigchar" style="font-size:52px">'+q+'</span>'+(em?'<span class="bigemoji">'+em+'</span>':'')+(wl?'<span class="bigpinyin">'+wl.pinyin+'</span>':'')+'</div>';
    if(wl){
      html+='<div class="def"><b>意思：</b>'+wl.explanation+'</div>';
      if(wl.first_lesson){
        const fl=wl.first_lesson;
        html+='<div><span class="badge b2">📖 首次出现在 '+BOOK_EMOJI[fl[0]]+' '+fl[0]+' 第'+fl[1]+'课《'+(lessonIndex[fl[0]+'_'+fl[1]]?lessonIndex[fl[0]+'_'+fl[1]].title:'')+'》</span></div>';
      }
      html+='<div class="def" style="margin-top:8px"><b>拆一拆：</b>';
      for(const ch of q){
        const ci2=charIndex[ch];
        html+='<button class="chip" style="margin:2px" onclick="document.getElementById(\'q\').value=\''+ch+'\';doSearch()">'+ch+(ci2?' '+ci2.pinyin:'')+'</button>';
      }
      html+='</div>';
    }else{
      html+='<div class="def">这个词不在词语表里，但我们在课文里找找看 🔍</div>';
    }
    const occ=findSentencesContaining(q);
    html+='<h2 style="margin-top:14px">📌 这个词语在课文里一共出现在 '+occ.length+' 个句子里</h2>';
    if(occ.length===0){
      // 模糊
      const fuzzy=[];
      for(const w in wordLookup){
        if(w.indexOf(q.slice(0,1))!==-1 && w!==q && w.length>=2) fuzzy.push(w);
      }
      html+='<div class="def">没找到完全一样的，试试下面的：</div><div class="related">';
      fuzzy.slice(0,18).forEach(w=>{html+='<button class="chip" onclick="document.getElementById(\'q\').value=\''+w+'\';doSearch()">'+w+'</button>'});
      html+='</div>';
    }else{
      html+=renderOcc(occ,q);
    }
    html+='</div>';
  }
  box.innerHTML=html;
  switchTab('search');
}
function renderOcc(occ,q){
  if(!occ.length) return '<div class="def">没有找到句子～</div>';
  // 按课分组 + 去重
  const groups={};
  const seen=new Set();
  occ.forEach(o=>{
    const key=o.book+'_'+o.lesson;
    const dedup=o.book+'|'+o.lesson+'|'+o.sentence;
    if(seen.has(dedup)) return;
    seen.add(dedup);
    if(!groups[key]) groups[key]={book:o.book,lesson:o.lesson,title:o.title,items:[]};
    groups[key].items.push(o);
  });
  let h='';
  const keys=Object.keys(groups);
  keys.forEach(k=>{
    const g=groups[k];
    const bi=BOOK_ORDER.indexOf(g.book);
    const badge='b'+((bi%6)+1);
    h+='<div class="card" style="padding:14px">';
    h+='<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px"><span class="badge '+badge+'">'+BOOK_EMOJI[g.book]+' '+g.book+' · 第'+g.lesson+'课《'+g.title+'》</span><span style="color:var(--muted);font-size:14px">'+g.items.length+' 句</span></div>';
    g.items.forEach(o=>{
      h+='<div class="sent"><span class="meta">'+BOOK_EMOJI[o.book]+' '+o.book+' · 第'+o.lesson+'课《'+o.title+'》</span>'+highlight(o.sentence,q);
      if(o.pinyin) h+='<span class="py">'+highlight(o.pinyin,q)+'</span>';
      h+='</div>';
    });
    h+='</div>';
  });
  return h;
}

function sparkle(){
  const ib=document.getElementById('q').getBoundingClientRect();

function openLesson(book,no){
  const L=lessonIndex[book+'_'+no];
  if(!L){document.getElementById('lessonContent').innerHTML='<div class="card">没有找到这一课～</div>';return}
  let html='<div class="card"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">';
  html+='<h2>'+BOOK_EMOJI[book]+' '+book+' 第'+L.lesson_no+'课《'+L.title+'》</h2>';
  html+='<button class="btn small" onclick="goTTS(\''+book+'\','+no+')">🔊 听这课</button>';
  html+='</div><div class="lesson-body">';
  // 用ruby显示课文
  L.tokens.forEach(line=>{
    html+='<div>';
    line.forEach(([w,p])=>{
      if(/[，。！？、；：""''（）…—]/.test(w)){html+='<span style="margin:0 1px">'+w+'</span>'}
      else{html+='<ruby>'+w+'<rt>'+p+'</rt></ruby>'}
    });
    html+='</div>';
  });
  html+='</div>';
  // 词语表
  html+='<h2 style="margin-top:18px">📒 本课词语表</h2><table class="wordlist"><thead><tr><th>词语</th><th>拼音</th><th>意思</th></tr></thead><tbody>';
  const seenW=new Set();
  L.words.forEach(w=>{
    if(!w.word||seenW.has(w.word)) return;
    seenW.add(w.word);
    html+='<tr><td class="w"><button class="chip" style="margin:0;padding:2px 8px" onclick="document.getElementById(\'q\').value=\''+w.word.replace(/'/g,"\\'")+'\';doSearch();switchTab(\'search\')">'+w.word+'</button></td><td class="p">'+w.pinyin+'</td><td>'+w.explanation+'</td></tr>';
  });
  // 从wordLookup里找课文中出现过的其他词
  for(const w in wordLookup){
    const wl=wordLookup[w];
    if(wl.first_lesson && wl.first_lesson[0]===book && wl.first_lesson[1]===no && !seenW.has(w)){
      html+='<tr><td class="w"><button class="chip" style="margin:0;padding:2px 8px" onclick="document.getElementById(\'q\').value=\''+w.replace(/'/g,"\\'")+'\';doSearch();switchTab(\'search\')">'+w+'</button></td><td class="p">'+wl.pinyin+'</td><td>'+wl.explanation+'</td></tr>';
    }
  }
  html+='</tbody></table></div>';
  document.getElementById('lessonContent').innerHTML=html;
  document.getElementById('lessonContent').scrollIntoView({behavior:'smooth',block:'start'});
}
function goTTS(book,no){
  document.getElementById('ttsBook').value=book;
  loadLessonsForTTS();
  document.getElementById('ttsLesson').value=no;
  loadTTSText();
  switchTab('tts');
}

let voices=[];let preferredVoice=null;
let curQueue=[];let curIdx=-1;let isPlaying=false;let isPaused=false;let playMode='full'; // 'full'|'follow'
let ttsTimer=null;

function loadVoices(){
  voices=window.speechSynthesis.getVoices();
  if(!voices.length) return;
  const sel=document.getElementById('voiceSel');
  // 分类
  const zh=voices.filter(v=>(v.lang||'').toLowerCase().startsWith('zh-cn')||/mandarin|xiaoxiao|yunxi|yunyang|yunjian|普通话/i.test(v.name));
  const yue=voices.filter(v=>/(zh-hk|zh-tw|yue|cantonese|hong kong|taiwan|粤|广东)/i.test(v.lang+v.name) && !zh.includes(v));
  const other=voices.filter(v=>!zh.includes(v)&&!yue.includes(v));
  function grp(label,arr,mark){
    if(!arr.length) return;
    const g=document.createElement('optgroup');g.label=label;
    arr.forEach(v=>{
      const o=document.createElement('option');o.value=v.name;o.textContent=mark+' '+v.name+' ('+v.lang+')';g.appendChild(o);
    });
    sel.appendChild(g);
  }
  sel.innerHTML='';
  grp('✅ 普通话（推荐）',zh,'✅');
  grp('⚠️ 粤语/台湾国语（不推荐）',yue,'⚠️');
  grp('🌐 其他语言',other,'🌐');
  // 恢复选择
  const saved=localStorage.getItem('hb_voice');
  if(saved && sel.querySelector('option[value="'+saved+'"]')){sel.value=saved}
  else if(zh.length){sel.value=zh[0].name}
  updateVoiceNote();
}
function updateVoiceNote(){
  const sel=document.getElementById('voiceSel');
  const name=sel.value;
  const v=voices.find(x=>x.name===name);
  const note=document.getElementById('voiceNote');
  if(!v){note.textContent='没有可用语音';note.style.background='var(--bg2)';return}
  const langs=(v.lang||'').toLowerCase();
  const n=v.name.toLowerCase();
  if(langs.startsWith('zh-cn')||/mandarin|xiaoxiao|yunxi|普通话/i.test(v.name)){
    note.textContent='✅ 当前是普通话，小朋友听得懂 🎈';note.style.background='#d8f0d8';note.style.color='#3e7a3e';
  }else if(/zh-hk|zh-tw|yue|cantonese|粤|广东|hong kong|taiwan/i.test(langs+n)){
    note.textContent='⚠️ 这是粤语/台湾国语，建议换成带 ✅ 的普通话';note.style.background='#ffe2c4';note.style.color='#a85b15';
  }else{
    note.textContent='❌ 这不是中文，可能会读成英文！请换带 ✅ 的';note.style.background='#f8d0d0';note.style.color='#a53a3a';
  }
  preferredVoice=v;
}

}
function loadLessonsForTTS(){
  const book=document.getElementById('ttsBook').value;
  const sel=document.getElementById('ttsLesson');
  sel.innerHTML='';
  const lessons=D.lessons_by_book[book]||[];
  lessons.forEach(L=>{const o=document.createElement('option');o.value=L.lesson_no;o.textContent='第'+L.lesson_no+'课《'+L.title+'》';sel.appendChild(o)});
  loadTTSText();
}
function loadTTSText(){
  stopTTS();
  const book=document.getElementById('ttsBook').value;
  const no=parseInt(document.getElementById('ttsLesson').value);
  const key=book+'_'+no;
  const tts=TTSM[key]||{pinyin:'',hanzi:''};
  document.getElementById('ttsPinyin').value=tts.pinyin;
  document.getElementById('ttsHanzi').value=tts.hanzi;
  document.getElementById('ttsStatus').textContent='已载入：'+BOOK_EMOJI[book]+' '+book+' 第'+no+'课《'+(lessonIndex[key]?lessonIndex[key].title:'')+'》，点按钮开始朗读 🎈';
  // 高亮清空
  document.getElementById('ttsHanzi').value=tts.hanzi;
  document.getElementById('prog').style.width='0%';
}
function buildQueueFromHanzi(){
  const book=document.getElementById('ttsBook').value;
  const no=parseInt(document.getElementById('ttsLesson').value);
  const L=lessonIndex[book+'_'+no];
  if(!L){curQueue=[];return}
  const q=[];
  if(playMode==='follow'){
    L.tokens.forEach(line=>{
      line.forEach(([w,p])=>{
        if(!w) return;
        if(/^[，。！？、；：…—]+$/.test(w)){q.push({type:'punct',text:w,dur:400});}
        else if(/^["""''（）()]+$/.test(w)){}
        else{q.push({type:'word',text:w,pinyin:p});}
      });
      q.push({type:'break',dur:600});
    });
  }else{
    L.sentences.forEach(s=>{
      q.push({type:'sent',text:s.hanzi});
    });
  }
  curQueue=q;
}
function onRateChange(){
  const r=parseFloat(document.getElementById('rate').value);
  document.getElementById('rateVal').textContent=r.toFixed(2)+'x';
  localStorage.setItem('hb_rate',r);
  if(isPlaying && !isPaused){
    // 实时变速：打断当前，用新速度重新说当前词
    window.speechSynthesis.cancel();
    if(ttsTimer){clearTimeout(ttsTimer);ttsTimer=null}
    speakNext();
  }
}
function speakNext(){
  if(!isPlaying||isPaused) return;
  if(curIdx>=curQueue.length-1){finishPlay();return}
  curIdx++;
  const item=curQueue[curIdx];
  // 进度
  document.getElementById('prog').style.width=Math.round((curIdx+1)/curQueue.length*100)+'%';
  // 高亮当前词
  highlightCurrent();
  const r=parseFloat(document.getElementById('rate').value);
  if(item.type==='punct'){ttsTimer=setTimeout(speakNext,item.dur);return}
  if(item.type==='break'){ttsTimer=setTimeout(speakNext,item.dur);return}
  const u=new SpeechSynthesisUtterance(item.text);
  if(preferredVoice) u.voice=preferredVoice;
  u.lang='zh-CN';u.rate=r;u.pitch=playMode==='follow'?1.15:1.05;
  if(playMode==='follow'){u.rate=Math.max(0.4,r*0.7)}
  let done=false;
  u.onend=()=>{if(done)return;done=true;
    if(playMode==='follow'){
      // 词间停顿
      const gap=item.text.length>2?350:250;
      ttsTimer=setTimeout(speakNext,gap);
    }else{
      ttsTimer=setTimeout(speakNext,500);
    }
  };
  u.onerror=()=>{if(done)return;done=true;ttsTimer=setTimeout(speakNext,200)};
  window.speechSynthesis.speak(u);
}
function highlightCurrent(){
  const ta=document.getElementById('ttsHanzi');
  const item=curQueue[curIdx];
  if(!item || (item.type!=='word'&&item.type!=='sent')){return}
  const text=ta.value;
  const key=item.text;
  // 按顺序找第n次出现
  let pos=-1,from=0,cnt=0;
  for(let i=0;i<=curIdx;i++){
    if(curQueue[i]===item || (curQueue[i].text===key && (curQueue[i].type==='word'||curQueue[i].type==='sent'))){
      pos=text.indexOf(key,from);
      from=pos+key.length;
      cnt++;
      if(i===curIdx) break;
    }
  }
  if(pos>=0){
    ta.focus();ta.setSelectionRange(pos,pos+key.length);
    // 简单把"当前词"放入status
    document.getElementById('ttsStatus').textContent='🎈 正在读：「'+key+'」（'+(item.pinyin||'')+'）';
  }
}
function startPlay(mode){
  if(!window.speechSynthesis){document.getElementById('ttsStatus').textContent='你的浏览器不支持语音朗读～试试 Chrome/Edge/Safari';return}
  stopTTS();
  playMode=mode;
  buildQueueFromHanzi();
  if(!curQueue.length){document.getElementById('ttsStatus').textContent='这课还没有文本可以读';return}
  isPlaying=true;isPaused=false;curIdx=-1;
  document.getElementById('pauseBtn').textContent='⏸️ 暂停';
  document.getElementById('ttsStatus').textContent=mode==='follow'?'🐢 逐词跟读开始～':'▶️ 朗读全文开始～';
  speakNext();
}
function playFull(){startPlay('full')}
function playFollow(){startPlay('follow')}
function pauseResume(){
  if(!isPlaying){return}
  if(isPaused){
    isPaused=false;
    window.speechSynthesis.resume();
    document.getElementById('pauseBtn').textContent='⏸️ 暂停';
    document.getElementById('ttsStatus').textContent='▶️ 继续读～';
    speakNext();
  }else{
    isPaused=true;
    window.speechSynthesis.pause();
    if(ttsTimer){clearTimeout(ttsTimer);ttsTimer=null}
    document.getElementById('pauseBtn').textContent='▶️ 继续';
    document.getElementById('ttsStatus').textContent='⏸️ 已暂停，按「继续」接着读';
  }
}
function stopTTS(){
  isPlaying=false;isPaused=false;curIdx=-1;curQueue=[];
  window.speechSynthesis&&window.speechSynthesis.cancel();
  if(ttsTimer){clearTimeout(ttsTimer);ttsTimer=null}
  document.getElementById('pauseBtn').textContent='⏸️ 暂停';
  document.getElementById('prog').style.width='0%';
  const ta=document.getElementById('ttsHanzi');if(ta)ta.setSelectionRange(0,0);
}
function finishPlay(){
  isPlaying=false;isPaused=false;curIdx=-1;curQueue=[];
  window.speechSynthesis.cancel();
  document.getElementById('prog').style.width='100%';
  document.getElementById('ttsStatus').textContent='🎉 读完啦！小朋友真棒！';
}
function copyText(which){
  const t=document.getElementById(which==='pinyin'?'ttsPinyin':'ttsHanzi').value;
  navigator.clipboard.writeText(t).then(()=>{document.getElementById('ttsStatus').textContent='📋 已复制到剪贴板'});
}
function downloadTxt(which){
  const book=document.getElementById('ttsBook').value;
  const no=parseInt(document.getElementById('ttsLesson').value);
  const key=book+'_'+no;
  const L=lessonIndex[key];
  const fn=book+'_L'+no+'_'+(L?L.title:'lesson')+'_'+which+'.txt';
  const content=document.getElementById(which==='pinyin'?'ttsPinyin':'ttsHanzi').value;
  const blob=new Blob([content],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
// init TTS
populateBooks();
loadLessonsForTTS();

if(!isNaN(savedRate)&&savedRate>=0.5&&savedRate<=1.3){document.getElementById('rate').value=savedRate;document.getElementById('rateVal').textContent=savedRate.toFixed(2)+'x'}

  loadVoices();

}else{
  document.getElementById('voiceNote').textContent='❌ 当前浏览器不支持语音';
}

  +['家','鱼','花','妈妈','巴士','苹果','朋友','星星','新加坡']
  .map(w=>'<button class="chip" onclick="document.getElementById(\'q\').value=\''+w+'\';doSearch()">'+w+'</button>').join(' ')
  +'</div></div>';
